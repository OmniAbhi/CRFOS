{% extends "base.html" %}{% block page_title %}Edit booking{% endblock %}{% block content %}<form method="post" class="panel"><p><label>Resource <select name="resource_id">{% for resource in resources %}<option value="{{ resource.id }}" {% if resource.id == booking.resource_id %}selected{% endif %}>{{ resource.name }}</option>{% endfor %}</select></label></p><p><label>User <select name="user_id">{% for user in users %}<option value="{{ user.id }}" {% if user.id == booking.user_id %}selected{% endif %}>{{ user.full_name }}</option>{% endfor %}</select></label></p><p><label>Department <select name="department_id"><option value="">Select department</option>{% for department in departments %}<option value="{{ department.id }}" {% if department.id == booking.department_id %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></label></p><p><label>Start <input name="start_time" type="datetime-local" value="{{ booking.start_time.strftime('%Y-%m-%dT%H:%M') }}"></label></p><p><label>End <input name="end_time" type="datetime-local" value="{{ booking.end_time.strftime('%Y-%m-%dT%H:%M') }}"></label></p><p><label>Expected occupancy <input name="expected_occupancy" type="number" min="0" value="{{ booking.expected_occupancy or '' }}"></label></p><p><label>Purpose <input name="purpose" value="{{ booking.purpose }}"></label></p><button class="primary-button" type="submit">Save booking</button></form>{% endblock %}

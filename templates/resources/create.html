{% extends "base.html" %}
{% block title %}CRFOS | Add resource{% endblock %}
{% block page_title %}Add resource{% endblock %}
{% block content %}
<div class="page-actions"><a class="text-link" href="{{ url_for('stage3.resources') }}">← Back to registry</a></div>
<form method="post" class="panel resource-form"><div class="form-grid"><label>Resource name <input name="name" value="{{ form_data.get('name', '') }}" required></label><label>Resource type <input name="resource_type" value="{{ form_data.get('resource_type', '') }}" placeholder="Classroom, laboratory, equipment..." required></label><label>Location <input name="location" value="{{ form_data.get('location', '') }}" required></label><label>Capacity <input name="capacity" type="number" min="0" value="{{ form_data.get('capacity', '') }}" placeholder="Optional"></label><label>Department <select name="department_id" required><option value="">Select department</option>{% for department in departments %}<option value="{{ department.id }}" {% if department.id|string == form_data.get('department_id', '') %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></label><label>Status <select name="status">{% for status in statuses|sort %}<option value="{{ status }}" {% if status == form_data.get('status', 'AVAILABLE') %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label></div><label>Description <textarea name="description" rows="5">{{ form_data.get('description', '') }}</textarea></label><div class="form-actions"><button class="primary-button" type="submit">Create resource</button><a class="secondary-button" href="{{ url_for('stage3.resources') }}">Cancel</a></div></form>
{% endblock %}

{% extends "base.html" %}{% block page_title %}Record actual usage{% endblock %}{% block content %}<form method="post" class="panel"><p><label>Resource <select name="resource_id" required>{% for resource in resources %}<option value="{{ resource.id }}">{{ resource.name }}</option>{% endfor %}</select></label></p><p><label>Related booking <select name="booking_id"><option value="">No related booking</option>{% for booking in bookings %}<option value="{{ booking.id }}">#{{ booking.id }} — {{ booking.start_time }} to {{ booking.end_time }}</option>{% endfor %}</select></label></p><p><label>Actual start <input name="actual_start_time" type="datetime-local"></label></p><p><label>Actual end <input name="actual_end_time" type="datetime-local"></label></p><p><label>Actual occupancy <input name="actual_occupancy" type="number" min="0"></label></p><p><label>Status <select name="usage_status">{% for status in statuses %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></label></p><p><label>Source <input name="source" value="MANUAL"></label></p><p><label>Notes <textarea name="notes"></textarea></label></p><button class="primary-button" type="submit">Save actual usage</button></form>{% endblock %}

{% extends "base.html" %}{% block title %}CRFOS | Record maintenance{% endblock %}{% block page_title %}Record maintenance{% endblock %}{% block content %}<div class="page-actions"><a class="text-link" href="{{ url_for('stage3.maintenance_records') }}">← Back to records</a></div><form method="post" class="panel resource-form maintenance-form"><div class="form-grid"><label>Resource <select name="resource_id" required><option value="">Select resource</option>{% for resource in resources %}<option value="{{ resource.id }}" {% if form_data.get('resource_id','') == resource.id|string %}selected{% endif %}>{{ resource.name }} · {{ resource.status }}</option>{% endfor %}</select></label><label>Technician <select name="technician_user_id"><option value="">Not specified</option>{% for user in users %}<option value="{{ user.id }}">{{ user.full_name }}</option>{% endfor %}</select></label><label>Maintenance type <input name="maintenance_type" value="{{ form_data.get('maintenance_type','') }}" required placeholder="Inspection, repair, service..."></label><label>Status <select name="status">{% for status in statuses %}<option value="{{ status }}" {% if status == form_data.get('status','SCHEDULED') %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>Reported date <input name="reported_date" type="datetime-local" value="{{ form_data.get('reported_date','') }}"></label><label>Scheduled date <input name="scheduled_date" type="datetime-local" value="{{ form_data.get('scheduled_date','') }}"></label><label>Downtime minutes <input name="downtime_minutes" type="number" min="0" value="{{ form_data.get('downtime_minutes','') }}"></label><label>Cost <input name="cost" type="number" min="0" step="0.01" value="{{ form_data.get('cost','') }}"></label></div><label>Description <textarea name="description" rows="4" required>{{ form_data.get('description','') }}</textarea></label><label>Notes <textarea name="notes" rows="4">{{ form_data.get('notes','') }}</textarea></label><div class="form-actions"><button class="primary-button" type="submit">Save maintenance record</button><a class="secondary-button" href="{{ url_for('stage3.maintenance_records') }}">Cancel</a></div></form>{% endblock %}
